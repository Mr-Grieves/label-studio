# Runs entirely on the Linux GPU server -- Label Studio plus all four
# backends, sharing Compose's default network so backends reach Label
# Studio at http://label-studio:8080 by service name, and Label Studio
# reaches each backend at http://<service-name>:9090 (see README.md).
#
# Bring up everything:
#   docker-compose up -d
# Or just Label Studio plus the backend(s) you want running right now:
#   docker-compose up -d label-studio sam2-backend
#
# Every backend requests a GPU via deploy.resources.reservations.devices,
# and every backend also mounts ./images read-only at the same path Label
# Studio serves it from, with LOCAL_FILES_DOCUMENT_ROOT set to match, so
# get_local_path() reads task images straight off disk instead of
# downloading them over HTTP on every inference call (see README.md).

services:
  label-studio:
    image: heartexlabs/label-studio:latest
    container_name: label-studio
    ports:
      - "8080:8080"
    # Lets Label Studio reach a backend running on the host, outside Docker, as
    # http://host.docker.internal:<port> -- e.g. under the VS Code debugger
    # (.vscode/launch.json). Docker Desktop has this built in; Linux needs it.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Lets Label Studio read image files straight from ./images/ (mounted
      # below) as a Local Storage source, instead of copying every file into
      # its own data/media/ folder through the browser Import button -- keeps
      # your source images and Label Studio's internal state in separate
      # folders. See README.md for the one-time UI setup step.
      - LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED=true
      - LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT=/label-studio/images
      # Label Studio (1.23+) refuses ML backend URLs that resolve to private or
      # loopback addresses, which is every backend here: the Compose service names
      # resolve to Docker's 172.x network, and host.docker.internal (the debugger,
      # see README.md) to 192.168.x. Two settings are involved:
      #   ML_BLOCK_LOCAL_IP       -- the model URL itself, and requests to it
      #   SSRF_PROTECTION_ENABLED -- the <model URL>/webhook Label Studio creates
      #                              when a model is added (also imports/exports)
      # Safe on a self-hosted, trusted machine.
      - ML_BLOCK_LOCAL_IP=false
      - SSRF_PROTECTION_ENABLED=false
    volumes:
      - "./data:/label-studio/data"
      - "./images:/label-studio/images:ro"

  sam2-backend:
    container_name: ml-backend-sam2
    build:
      context: ./backends/sam2
    depends_on:
      - label-studio
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    environment:
      - LOG_LEVEL=DEBUG
      - WORKERS=1
      - THREADS=8
      - MODEL_DIR=/data/models
      - DEVICE=cuda
      - MODEL_CONFIG=configs/sam2.1/sam2.1_hiera_l.yaml
      - MODEL_CHECKPOINT=sam2.1_hiera_large.pt
      - LABEL_STUDIO_URL=http://label-studio:8080
      - LABEL_STUDIO_API_KEY=${LABEL_STUDIO_API_KEY}
      - LOCAL_FILES_DOCUMENT_ROOT=/label-studio/images
    ports:
      - "9090:9090"
    volumes:
      - "./backends/sam2/data:/data"
      - "./images:/label-studio/images:ro"

  medsam-backend:
    container_name: ml-backend-medsam
    build:
      context: ./backends/medsam
    depends_on:
      - label-studio
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    environment:
      - LOG_LEVEL=DEBUG
      - WORKERS=1
      - THREADS=8
      - MODEL_DIR=/data/models
      - DEVICE=cuda
      - MODEL_TYPE=vit_b
      - MODEL_CHECKPOINT=checkpoints/medsam_vit_b.pth
      - LABEL_STUDIO_URL=http://label-studio:8080
      - LABEL_STUDIO_API_KEY=${LABEL_STUDIO_API_KEY}
      - LOCAL_FILES_DOCUMENT_ROOT=/label-studio/images
    ports:
      - "9091:9090"
    volumes:
      - "./backends/medsam/data:/data"
      - "./backends/medsam/checkpoints:/app/checkpoints:ro"
      - "./images:/label-studio/images:ro"

  sonobase-backend:
    container_name: ml-backend-sonobase
    build:
      context: ./backends/sonobase
    depends_on:
      - label-studio
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    environment:
      - LOG_LEVEL=DEBUG
      - WORKERS=1
      - THREADS=8
      - MODEL_DIR=/data/models
      - DEVICE=cuda
      - LABEL_STUDIO_URL=http://label-studio:8080
      - LABEL_STUDIO_API_KEY=${LABEL_STUDIO_API_KEY}
      - LOCAL_FILES_DOCUMENT_ROOT=/label-studio/images
    ports:
      - "9092:9090"
    volumes:
      - "./backends/sonobase/data:/data"
      - "./images:/label-studio/images:ro"

  effsam-backend:
    container_name: ml-backend-effsam
    build:
      context: ./backends/effsam
      # A GitHub token that can read clariusmhealth/pypi-private-repo, for
      # pyconvert. Build with: PRIVATE_REPO_GH_TOKEN=$(gh auth token) docker compose build effsam-backend
      secrets:
        - PRIVATE_REPO_GH_TOKEN
    depends_on:
      - label-studio
    # CPU only: the model is small enough (~0.1 s per image, ~20 ms per click),
    # which leaves the GPU to the other backends.
    environment:
      - LOG_LEVEL=DEBUG
      # One worker: the embedding and mask-loopback caches live in the process.
      - WORKERS=1
      - THREADS=8
      # The encoder/ and decoder/ SavedModels from export_savedmodel.py
      - MODEL_DIR=/models
      - LABEL_STUDIO_URL=http://label-studio:8080
      - LABEL_STUDIO_API_KEY=${LABEL_STUDIO_API_KEY}
      - LOCAL_FILES_DOCUMENT_ROOT=/label-studio/images
    ports:
      - "9093:9090"
    volumes:
      - "./backends/effsam/savedmodel:/models:ro"
      - "./images:/label-studio/images:ro"

secrets:
  PRIVATE_REPO_GH_TOKEN:
    environment: PRIVATE_REPO_GH_TOKEN
